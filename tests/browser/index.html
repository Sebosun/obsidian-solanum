<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      body {
        --text-normal: #d8d0bf;
        --text-muted: #9a9487;
        --text-faint: #706b61;
        --text-accent: #a7bd95;
        --background-primary: #24251e;
        --background-secondary: #2c2d24;
        --background-modifier-border: #45463c;
        --background-modifier-hover: #3a3b31;
        --background-modifier-form-field: #24251e;
        --interactive-accent: #6f9460;
        font: 14px system-ui;
        background: var(--background-primary);
        color: var(--text-normal);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        background: var(--background-secondary);
        border: 1px solid var(--background-modifier-border);
        border-radius: 5px;
        padding: 5px;
      }
      .solanum-view {
        height: 100%;
      }
    </style>
  </head>
  <body class="theme-dark">
    <div id="root" class="solanum-view"></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
